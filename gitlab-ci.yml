stages:
  - build
  - configuration
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: $DOCKER_HUB_USERNAME/marcel-api

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind

  before_script:
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin

  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA $IMAGE_NAME:latest
    - docker push $IMAGE_NAME:latest
  only :
    - main

# prod:
#   stage: deploy
#   script:
#     - echo "Déploiement en test..."


copy-configuration:
  stage: configuration
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" > id_rsa
    - chmod 600 id_rsa
  script:
    - echo "APP_NAME=$APP_NAME" > .env
    - echo "APP_ENV=$APP_ENV" >> .env
    - echo "APP_KEY=$APP_KEY" >> .env
    - echo "APP_DEBUG=$APP_DEBUG" >> .env
    - echo "APP_URL=$APP_URL" >> .env
    - echo "APP_LOCALE=$APP_LOCALE" >> .env
    - echo "APP_FALLBACK_LOCALE=$APP_FALLBACK_LOCALE" >> .env
    - echo "APP_FAKER_LOCALE=$APP_FAKER_LOCALE" >> .env
    - echo "APP_MAINTENANCE_DRIVER=$APP_MAINTENANCE_DRIVER" >> .env
    - echo "PHP_CLI_SERVER_WORKERS=$PHP_CLI_SERVER_WORKERS" >> .env
    - echo "BCRYPT_ROUNDS=$BCRYPT_ROUNDS" >> .env
    - echo "LOG_CHANNEL=$LOG_CHANNEL" >> .env
    - echo "LOG_STACK=$LOG_STACK" >> .env
    - echo "LOG_DEPRECATIONS_CHANNEL=$LOG_DEPRECATIONS_CHANNEL" >> .env
    - echo "LOG_LEVEL=$LOG_LEVEL" >> .env

    - echo "DB_CONNECTION=$DB_CONNECTION" >> .env
    - echo "DB_HOST=$DB_HOST" >> .env
    - echo "DB_PORT=$DB_PORT" >> .env
    - echo "DB_DATABASE=$DB_DATABASE" >> .env
    - echo "DB_USERNAME=$DB_USERNAME" >> .env
    - echo "DB_PASSWORD=$DB_PASSWORD" >> .env

    - echo "SESSION_DRIVER=$SESSION_DRIVER" >> .env
    - echo "SESSION_LIFETIME=$SESSION_LIFETIME" >> .env
    - echo "SESSION_ENCRYPT=$SESSION_ENCRYPT" >> .env
    - echo "SESSION_PATH=$SESSION_PATH" >> .env
    - echo "SESSION_DOMAIN=$SESSION_DOMAIN" >> .env
    - echo "SESSION_EXPIRE_ON_CLOSE=$SESSION_EXPIRE_ON_CLOSE" >> .env

    - echo "BROADCAST_CONNECTION=$BROADCAST_CONNECTION" >> .env
    - echo "FILESYSTEM_DISK=$FILESYSTEM_DISK" >> .env
    - echo "QUEUE_CONNECTION=$QUEUE_CONNECTION" >> .env

    - echo "CACHE_STORE=$CACHE_STORE" >> .env

    - echo "MEMCACHED_HOST=$MEMCACHED" >> .env

    - echo "REDIS_CLIENT=$REDIS_CLIENT" >> .env
    - echo "REDIS_HOST=$REDIS_HOST" >> .env
    - echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> .env
    - echo "REDIS_PORT=$REDIS_PORT" >> .env

    - echo "MAIL_MAILER=$MAIL_MAILER" >> .env
    - echo "MAIL_SCHEME=$MAIL_SCHEME" >> .env
    - echo "MAIL_HOST=$MAIL_HOST" >> .env
    - echo "MAIL_PORT=$MAIL_PORT" >> .env
    - echo "MAIL_USERNAME=$MAIL_USERNAME" >> .env
    - echo "MAIL_PASSWORD=$MAIL_PASSWORD" >> .env
    - echo "MAIL_FROM_ADDRESS=$MAIL_FROM_ADRRESS" >> .env
    - echo "MAIL_FROM_NAME=$MAIL_FROM_NAME" >> .env

    - echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> .env
    - echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> .env
    - echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION" >> .env
    - echo "AWS_BUCKET=$AWS_BUCKET" >> .env
    - echo "AWS_USE_PATH_STYLE_ENDPOINT=$AWS_USE_PATH_STYLE_ENDPOINT" >> .env

    - echo "VITE_APP_NAME=$VITE_APP_NAME" >> .env

    - cat .env
    - scp -o StrictHostKeyChecking=no -i id_rsa .env $SSH_USER@$SSH_HOST:/app/docker/marcelapi/.env
    - scp -o StrictHostKeyChecking=no -i id_rsa docker-compose.yml $SSH_USER@$SSH_HOST:/app/docker/marcelapi/docker-compose.yml
  only:
    - main

deploy:
  stage: deploy
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y openssh-client
    - printf '%s\n' "$SSH_PRIVATE_KEY" > id_rsa
    - chmod 600 id_rsa
  script:
    - echo "Déploiement en cours..."
    - ssh -o StrictHostKeyChecking=no -i id_rsa $SSH_USER@$SSH_HOST '
      echo "Chemin de Docker :";
      which docker;
      cd /app/docker/marcelapi;
      /usr/bin/docker compose pull;
      /usr/bin/docker compose down --remove-orphans;
      /usr/bin/docker container rm -f marcelapi || true;
      /usr/bin/docker container prune -f;
      /usr/bin/docker compose up -d --remove-orphans
      '
  only:
    - main
