version: '3.8'

services:
  # API Laravel
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marcel-api
    ports:
      - "8000:80"
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=marcel_db
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - DB_CONNECTION=mysql
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./bootstrap/cache:/app/bootstrap/cache
    networks:
      - marcel-network
    restart: unless-stopped

  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: marcel-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=marcel_db
      - MYSQL_USER=marcel_user
      - MYSQL_PASSWORD=marcel_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - marcel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  # phpMyAdmin (optionnel)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: marcel-phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - mysql
    networks:
      - marcel-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  marcel-network:
    driver: bridge
